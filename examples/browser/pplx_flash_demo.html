<!doctype html><meta charset="utf-8"><title>Flash browser demo integration</title>
<iframe id="demo" style="width:1200px;height:1800px;border:0"></iframe>
<script type="module">
const frame=document.querySelector('#demo');
const q=new URLSearchParams(location.search),bundle=q.get('bundle')||'/artifacts/web/pplx-flash-demo';
if(!bundle.startsWith('/artifacts/web/'))throw Error('Local bundle required');
const url=`${bundle}/index.html?modelSource=/models/pplx-decider-flash-v1.2&backend=${q.get('backend')||'wasm'}`;
const load=()=>new Promise(resolve=>{frame.onload=resolve;frame.src=url;});
const heartbeat=setInterval(()=>{window.progress=frame.contentWindow?.progress;},500);
try{
 await load();const ready=await frame.contentWindow.decisiveReady;
 if(q.get('ui')==='1'){
   const select=frame.contentDocument.querySelector('#execution-backend');
   if(!ready.webgpu||!select||select.querySelector('[value=webgpu]').disabled)throw Error('WebGPU selector unavailable');
   select.value='webgpu';select.dispatchEvent(new Event('change'));
   if(!frame.contentDocument.querySelector('#backend').textContent.includes('WebGPU'))throw Error('Backend badge did not update');
   window.result={ui:true,webgpu:ready.webgpu,backend:select.value,ready:ready.ready};
 } else {
 if(q.get('resume')==='1'){
  const operation=frame.contentWindow.decisiveBench.download();
  operation.catch(()=>{});
  await new Promise(resolve=>setTimeout(resolve,1500));
  frame.contentDocument.querySelector('#cancel').click();
  try{await operation;throw Error('Download was not interrupted');}catch(e){if(!String(e).includes('Stopped'))throw e;}
 }
 await frame.contentWindow.decisiveBench.download();
 await load();const cached=await frame.contentWindow.decisiveReady;
 if(!cached.ready)throw Error('Verified cache was not reused after reload');
 frame.contentDocument.querySelector('#warmups').value='1';
 frame.contentDocument.querySelector('#iterations').value=q.get('runs')||'2';
 const result=await frame.contentWindow.decisiveBench.benchmark();
 const reference=await(await fetch('/tests/fixtures/pplx_flash/reference.json')).json();
 function compare(a,b){
  if(typeof b==='number'){if(Math.abs(a-b)>1e-4)throw Error(`Output mismatch: ${a} vs ${b}`);}
  else if(b&&typeof b==='object'){for(const k of Object.keys(b))compare(a[k],b[k]);}
  else if(a!==b)throw Error('Output mismatch');
 }
 for(const run of result.runs){compare(run.response,reference.cases[0].response);if(!(run.elapsed_ms>0&&run.layers.length===32&&run.wasm_linear_memory_bytes>0))throw Error('Missing measurements');}
 if(result.summary.samples!==Number(frame.contentDocument.querySelector('#iterations').value))throw Error('Warmups counted as measured samples');
 window.result={...result,integration:{cache_reload:true,resume_requested:q.get('resume')==='1',output_bound:1e-4}};
 }
}catch(error){window.result={error:String(error),progress:window.progress};}
finally{clearInterval(heartbeat);}
</script>
