<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perplexity Flash · Queued comparisons</title>
<style>body{font:16px/1.6 system-ui;max-width:1000px;margin:40px auto;padding:0 24px;color:#18372f;background:#f3f6f4}button{font:inherit;padding:10px 18px;margin-right:8px}pre{white-space:pre-wrap;max-height:400px;overflow:auto;font-size:12px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{padding:9px;border-bottom:1px solid #ccd8d2;text-align:left}</style>
<h1>Queued model comparisons</h1><p>Each phase runs two configurations through all 32 decoder layers. Keep this page visible. Synthetic weights do not establish trained-model quality.</p>
<button id="run">Run queue</button><button id="stop" disabled>Stop</button><button id="download" disabled>Download reports</button>
<p id="status" role="status">Ready</p><table><thead><tr><th>Phase</th><th>Tokens</th><th>Baseline</th><th>Candidate</th><th>Speedup</th></tr></thead><tbody id="rows"></tbody></table>
<details><summary>Queue plan</summary><pre id="plan"></pre></details><details><summary>Full reports</summary><pre id="report"></pre></details>
<script id="bytes" type="application/octet-stream">__WASM_BASE64__</script>
<script id="worker" type="text/plain">/*__WASM_BINDINGS__*/
/*__SYNTHETIC_JS__*/</script>
<script>
const BUILD=__BUILD_JSON__,PLAN=__QUEUE_JSON__;
const $=s=>document.querySelector(s),query=new URLSearchParams(location.search);
const key='pplx-queue-running:'+location.pathname+location.search;
let worker,blobUrl,cancel,report,current,stopRequested=false;
$('#plan').textContent=JSON.stringify(PLAN,null,2);
const post=async(kind,value)=>{
 const endpoint=query.get('report');if(!endpoint)return;
 if(!['127.0.0.1','localhost'].includes(location.hostname)||!/^\/results\/[a-f0-9]{32}$/.test(endpoint))throw Error('Local collector required');
 const response=await fetch(kind==='result'?endpoint:endpoint.replace('/results/','/progress/'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});
 if(!response.ok)throw Error(`Collector HTTP ${response.status}`);
};
const phase=async(spec,bytes)=>{
 const start=performance.now();current={build:BUILD,browser:navigator.userAgent,wasm_sha256:BUILD.wasm_sha256,page_hidden_during_run:document.hidden,visibility_events:[{elapsed_ms:0,epoch_ms:performance.timeOrigin+start,hidden:document.hidden}]};
 let timeout;
 try{
  const result=await new Promise((resolve,reject)=>{
   cancel=()=>reject(Error('Stopped by user'));
   blobUrl=URL.createObjectURL(new Blob([$('#worker').textContent],{type:'text/javascript'}));worker=new Worker(blobUrl);
   timeout=setTimeout(()=>reject(Error('Phase timed out after 20 minutes')),1200000);
   worker.onerror=e=>reject(Error(e.message||'Worker failed'));
   worker.onmessage=({data})=>{
    if(data.type==='ready'){const copy=bytes.slice();worker.postMessage({...spec,seed:spec.seed??137,audit:true,safari:true,safariTune:true,optimization:true,bytes:copy.buffer},[copy.buffer]);}
    else if(data.type==='progress'){const message=`${spec.id}: ${data.message}`;$('#status').textContent=message;post('progress',{message}).catch(()=>{});}
    else if(data.type==='result')resolve(data.report);
   };
  });
  const resultReport={...current,...result};
  for(const run of resultReport.runs||[])run.page_hidden=resultReport.visibility_events.some((event,i)=>event.hidden&&event.epoch_ms<run.finished_epoch_ms&&(resultReport.visibility_events[i+1]?.epoch_ms??Infinity)>run.started_epoch_ms);
  resultReport.measured_runs_hidden=(resultReport.runs||[]).some(r=>!r.warmup&&r.page_hidden);
  return resultReport;
 }finally{clearTimeout(timeout);worker?.terminate();worker=null;cancel=null;current=null;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=null;}
};
const save=async()=>{window.result=report;$('#report').textContent=JSON.stringify(report,null,2);$('#download').disabled=false;await post('result',report);};
$('#run').onclick=async()=>{
 report={schema_version:1,experiment:'pplx-synthetic-queue-v1',completed:false,build:BUILD,expected_phases:PLAN.length,phases:[],started_at:new Date().toISOString()};stopRequested=false;
 $('#run').disabled=true;$('#stop').disabled=false;$('#download').disabled=true;$('#rows').replaceChildren();sessionStorage.setItem(key,'running');
 try{
  const bytes=Uint8Array.from(atob($('#bytes').textContent.trim()),c=>c.charCodeAt(0));
  const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');if(hash!==BUILD.wasm_sha256)throw Error('Wasm integrity mismatch');
  for(const spec of PLAN){
   report.active_phase=spec.id;
   const result=await phase(spec,bytes);report.phases.push({id:spec.id,report:result});
   await post('progress',{message:`${spec.id}: phase report saved`,phase_report:{index:report.phases.length,report:result}});
   for(const c of result.cases||[])for(const [id,speedup] of Object.entries(c.speedups)){const row=document.createElement('tr');for(const value of [spec.id,c.rows,(c.variants[result.baseline_id].median_execution_ms/1000).toFixed(3)+' s',(c.variants[id].median_execution_ms/1000).toFixed(3)+' s',speedup.toFixed(3)+'×']){const cell=document.createElement('td');cell.textContent=value;row.append(cell);}$('#rows').append(row);}
   if(!result.completed)throw Error(`${spec.id}: ${result.error||'Incomplete phase'}`);
   if(stopRequested)throw Error('Stopped by user');
  }
  delete report.active_phase;report.completed=true;$('#status').textContent='Queue complete';
 }catch(error){report.error=String(error);$('#status').textContent=report.error;}
 finally{sessionStorage.removeItem(key);$('#run').disabled=false;$('#stop').disabled=true;await save().catch(error=>$('#status').textContent+=` ${error}`);}
};
$('#stop').onclick=()=>{stopRequested=true;cancel?.();};
$('#download').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.href=url;a.download='pplx-synthetic-queue.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.addEventListener('visibilitychange',()=>{if(current){const now=performance.timeOrigin+performance.now();current.visibility_events.push({elapsed_ms:now-current.visibility_events[0].epoch_ms,epoch_ms:now,hidden:document.hidden});current.page_hidden_during_run ||= document.hidden;}});
if(query.get('autorun')==='1'){
 if(sessionStorage.getItem(key)==='running'){report={experiment:'pplx-synthetic-queue-v1',completed:false,reloaded_during_run:true,expected_phases:PLAN.length,phases:[],error:'Browser reloaded an unfinished queue; no timing verdict'};sessionStorage.removeItem(key);$('#status').textContent=report.error;save().catch(error=>$('#status').textContent+=` ${error}`);}
 else $('#run').click();
}
</script></html>
