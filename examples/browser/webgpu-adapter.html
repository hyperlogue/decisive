<!doctype html><meta charset="utf-8"><title>WebGPU adapter capability probe</title>
<pre id="status">Checking WebGPU…</pre>
<script type="module">
try {
  const adapter = await navigator.gpu?.requestAdapter({powerPreference: 'high-performance'});
  if (!adapter) {
    window.result = {available: false, reason: 'No WebGPU adapter'};
  } else {
    const info = adapter.info;
    const device = await adapter.requestDevice();
    const storage = device.createBuffer({size: 64, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC});
    const readback = device.createBuffer({size: 64, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST});
    const pipeline = device.createComputePipeline({
      layout: 'auto',
      compute: {
        module: device.createShaderModule({code: `
          @group(0) @binding(0) var<storage, read_write> output: array<f32>;
          @compute @workgroup_size(16) fn main(@builtin(global_invocation_id) id: vec3<u32>) {
            let value = f32(id.x + 1u);
            output[id.x] = value * value;
          }`}),
        entryPoint: 'main',
      },
    });
    const group = device.createBindGroup({layout: pipeline.getBindGroupLayout(0), entries: [{binding: 0, resource: {buffer: storage}}]});
    const commands = device.createCommandEncoder();
    const pass = commands.beginComputePass();
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, group);
    pass.dispatchWorkgroups(1);
    pass.end();
    commands.copyBufferToBuffer(storage, 0, readback, 0, 64);
    device.queue.submit([commands.finish()]);
    await readback.mapAsync(GPUMapMode.READ);
    const values = Array.from(new Float32Array(readback.getMappedRange()));
    if (values.some((v, i) => v !== (i + 1) ** 2)) throw Error('Compute/readback check failed');
    window.result = {
      available: true,
      adapter: {
        vendor: info.vendor, architecture: info.architecture,
        device: info.device, description: info.description,
        is_fallback_adapter: info.isFallbackAdapter ?? adapter.isFallbackAdapter ?? null,
      },
      features: Array.from(adapter.features).sort(),
      compute_readback_passed: true,
      browser: navigator.userAgent,
    };
    readback.unmap();
    storage.destroy();
    readback.destroy();
    device.destroy();
  }
} catch (error) {
  window.result = {error: String(error)};
}
document.querySelector('#status').textContent = JSON.stringify(window.result, null, 2);
</script>
