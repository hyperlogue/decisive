[package]
name = "decisive"
version = "0.1.0"
edition = "2024"
autobenches = false
license = "MIT OR Apache-2.0"
description = "A fast decision-model inference engine for browsers and edge devices"

[lib]
name = "decisive"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "decisive"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "all-models", "fp16", "int8"]
all-models = ["laya", "decima", "jev-style", "kev", "pplx-flash"]
pplx-flash = ["dep:sha2"]
pplx-wasm-fma = ["pplx-flash", "wasm"]
laya = []
decima = []
jev-style = []
kev = ["dep:zip"]
fp16 = []
int8 = []
cli = ["cpu", "dep:clap", "dep:ureq", "dep:tiny_http", "dep:sha2"]
cpu = ["dep:memmap2", "dep:rayon", "dep:libloading", "dep:sha2"]
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
webgpu = ["dep:wgpu", "dep:futures-channel"]
gpu-native = ["cpu", "webgpu", "wgpu/vulkan", "dep:pollster"]
bench = ["cli"]
browser-bench = ["bench", "dep:tungstenite"]
kernel-checks = ["wasm"]
decima-wasm-fma = ["wasm", "decima"]
decima-wasm-threads = ["wasm", "decima", "dep:rayon", "dep:wasm-bindgen-rayon"]

[dependencies]
sha2 = { version = "0.10", optional = true }
anyhow = "1"
bytemuck = "1"
half = { version = "2", features = ["bytemuck"] }
libm = "0.2"
matrixmultiply = "0.3.11"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
zip = { version = "9.0.2", default-features = false, optional = true }
memmap2 = { version = "0.9", optional = true }
rayon = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
ureq = { version = "3", optional = true }
tiny_http = { version = "0.12", optional = true }
libloading = { version = "0.8", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Response", "Cache", "CacheStorage"] }
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl", "webgpu"], optional = true }
futures-channel = { version = "0.3", optional = true }
pollster = { version = "0.4", optional = true }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "=1.3.0", features = ["no-bundler"], optional = true }

[dev-dependencies]
sha2 = "0.10"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1


[[bench]]
harness = false
name = "causal_profile"
required-features = ["cli", "kev", "jev-style"]

[[bench]]
harness = false
name = "check_browser"
required-features = ["cli", "laya"]

[[bench]]
harness = false
name = "check_outputs"
required-features = ["cli", "laya"]

[[bench]]
harness = false
name = "decima_compare"
required-features = ["cli", "decima"]

[[bench]]
harness = false
name = "decima_lengths"
required-features = ["cli", "decima"]

[[bench]]
harness = false
name = "decima_quality"
required-features = ["cli"]

[[bench]]
harness = false
name = "decima_xnli"
required-features = ["cli", "decima"]

[[bench]]
harness = false
name = "framework_probe"
required-features = ["cli"]

[[bench]]
harness = false
name = "long_inputs"
required-features = ["cli", "laya"]

[[bench]]
harness = false
name = "long_quality"
required-features = ["cli", "laya"]

[[bench]]
harness = false
name = "profile_inference"
required-features = ["cli", "laya"]

[[bench]]
harness = false
name = "profile_summary"
required-features = ["cli", "laya"]

[[bench]]
harness = false
name = "serving_inputs"
required-features = ["cli", "laya"]

[[bench]]
harness = false
name = "serving_matrix"
required-features = ["cli", "laya"]

[[bench]]
harness = false
name = "webgpu_check"
required-features = ["cli", "laya", "decima", "gpu-native"]

[[bench]]
name = "laya_vm"
harness = false
required-features = ["bench", "laya"]

[[bench]]
name = "causal_bench"
harness = false
required-features = ["bench", "kev", "jev-style"]

[[bench]]
name = "browser_bench"
harness = false
required-features = ["browser-bench"]

[[bench]]
name = "http_probe"
harness = false
required-features = []

[[bench]]
name = "perf_to_folded"
harness = false
required-features = []
